<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walter Status Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2f6f1;
    --surface: #ffffff;
    --ink: #172018;
    --ink-2: #55634f;
    --line: #d7e0d3;
    --accent-ink: #6e4416;
    --up: #39ff14;
    --down: #ff0037;
    --unknown: #85927f;
    --shadow: 0 1px 2px rgba(23, 32, 24, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10150f; --surface: #161d15; --ink: #e9efe6; --ink-2: #a9b6a3;
      --line: #2a352686; --accent-ink: #f0b876;
      --up: #39ff14; --down: #ff0037; --unknown: #9aab9c;
      --shadow: 0 1px 2px rgba(0,0,0,0.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink); margin: 0;
    font-family: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
    padding: 28px 20px 60px; max-width: 760px; margin-inline: auto;
  }
  header {
    display: flex; flex-direction: column; gap: 8px;
    padding-bottom: 18px; border-bottom: 1px solid var(--line); margin-bottom: 22px;
  }
  .eyebrow {
    font-family: "IBM Plex Mono", monospace; font-size: 0.72rem; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--accent-ink); font-weight: 600;
  }
  h1 { font-size: 1.5rem; font-weight: 700; margin: 0; letter-spacing: -0.01em; }

  .board { display: flex; flex-direction: column; gap: 10px; }
  .row {
    display: flex; align-items: center; gap: 16px;
    background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px;
    padding: 14px 18px; box-shadow: var(--shadow);
    transition: background-color 0.4s ease, border-color 0.4s ease;
  }
  .row.up { background: var(--up); border-color: var(--up); }
  .row.down { background: var(--down); border-color: var(--down); }

  /* Filled rows get black text throughout for contrast against the solid neon fill. */
  .row.up .row-name, .row.up .row-state,
  .row.down .row-name, .row.down .row-state {
    color: #000;
  }

  .led {
    width: 18px; height: 18px; border-radius: 50%; flex: none;
    background: var(--unknown); transition: background-color 0.4s ease;
  }
  .led.up, .led.down { background: #000; }

  .row-name { flex: 1; min-width: 0; font-size: 0.98rem; font-weight: 600; }
  .row-state {
    font-family: "IBM Plex Mono", monospace; font-size: 0.82rem; font-weight: 700;
    color: var(--ink-2); flex: none;
  }

  /* Down/error states blink -- a hard on/off flash (step-start), not a fade. */
  @keyframes blink-text { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  .row-state.down { animation: blink-text 1s step-start infinite; }
</style>
</head>
<body>

<header>
  <span class="eyebrow">Live &middot; polls every 30s</span>
  <h1>Walter Status Board</h1>
</header>

<div class="board">
  <div class="row" id="row-healthchecks">
    <span class="led" id="led-healthchecks"></span>
    <div class="row-name">healthchecks.io</div>
    <div class="row-state" id="state-healthchecks">WORKING</div>
  </div>

  <div class="row" id="row-sms">
    <span class="led" id="led-sms"></span>
    <div class="row-name">STATUS SMS reply</div>
    <div class="row-state" id="state-sms">WORKING</div>
  </div>
</div>

<script>
(function () {
  var POLL_MS = 30000;

  function setRow(prefix, isUp, stateText) {
    var row = document.getElementById("row-" + prefix);
    var led = document.getElementById("led-" + prefix);
    var state = document.getElementById("state-" + prefix);
    var cls = isUp === true ? "up" : isUp === false ? "down" : "";
    row.className = "row" + (cls ? " " + cls : "");
    led.className = "led" + (cls ? " " + cls : "");
    state.className = "row-state" + (cls ? " " + cls : "");
    state.textContent = stateText;
  }

  // --- healthchecks.io ---
  function pollHealthchecks() {
    var url = "https://healthchecks.io/badge/d2154fd2-4941-4d30-bc39-bd30e6/de5Iy6hb-2/anti-theft.json";
    fetch(url, { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (d) {
        var isUp = d.status === "up";
        setRow("healthchecks", isUp, isUp ? "ACTIVE" : "NOT ACTIVE");
      })
      .catch(function () { setRow("healthchecks", false, "ERROR"); });
  }

  // --- STATUS SMS reply (on-demand, not periodic -- informational only, no up/down coloring) ---
  // Uses the feed's public detail endpoint (no API key needed, since this feed is
  // set to public visibility on Adafruit IO) rather than /data/last, which always
  // requires a key regardless of the feed's own visibility setting.
  function pollSms() {
    var url = "https://io.adafruit.com/api/v2/VladBites/feeds/sms-event";
    fetch(url, { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (d) {
        if (!d || !d.updated_at || d.last_value == null) { setRow("sms", null, "NO DATA"); return; }
        setRow("sms", null, "LAST REPLY");
      })
      .catch(function () { setRow("sms", false, "ERROR"); });
  }

  function pollAll() { pollHealthchecks(); pollSms(); }
  pollAll();
  setInterval(pollAll, POLL_MS);
})();
</script>

</body>
</html>
